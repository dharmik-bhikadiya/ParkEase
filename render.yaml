services:
  - type: web
    name: parkease-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: parkease-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://parkease-web.vercel.app"]'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PAYMENT_PROVIDER
        value: SANDBOX
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: parkease-db
    databaseName: parkease_db
    user: parkease_user
    region: singapore
    plan: free
